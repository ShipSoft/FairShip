description: "UBT simplified simulation geometry on a 340 x 504 cm^2 detector plane"
kind: simulation
units: cm
origin: "beam axis at (0, 0)"
note: "The plane covers x in [-170, 170] cm and y in [-334, 170] cm: from 2 cm above the ECN3 floor (y = -336 cm) up to 1.7 m, enough to cover the decay vessel entrance. Tile edges lie on x, y = 2 + 4k cm, so the central 40 x 40 mm2 tile is centred on the beam axis. The plane is split into 17 columns and 25 rows of 20 x 20 cm2 parent regions, centred on the beam axis, plus a bottom row of 20 x 4 cm2 regions (y in [-334, -330] cm) that brings the plane closer to the floor. In the central neck (|y| < 50 cm), the regions with |x| > 90 cm are made of 20 x 20 mm2 tiles; all other regions are made of 40 x 40 mm2 tiles."
bounds:
  x: [-170, 170]
  y: [-334, 170]
