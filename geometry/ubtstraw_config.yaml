# Geometry configuration of UBT (veto) in FairShip
UBTStraw:
  height: 150 # Aperture height (y) in cm (half length); the tiers are 2/3 of it apart
  wire_thickness: 0.0025 # Sense wire thickness in cm
  wall_thickness: 0.0015 # Straw wall thickness in cm
  outer_straw_diameter: 0.5 # in cm
  straw_pitch: 0.6 # Distance (x) between straws in a row in cm
  row_offset: 0.25 # Offset (x) of straws between the two rows of a square in cm
  delta_z_row: 0.433 # Distance (z = sqrt(3)/2 * D) between the two rows of a square in cm
  delta_z_view: 6 # Distance (z) between the layers (views y1, u, v) in cm
  view_angle: 15 # Stereo angle in degree
  frame_width: 126 # Outer width (x) of the frame of one square in cm (full length); the straws fill the inside
  frame_height: 119.33 # Outer height (y) of the frame of one square in cm (full length); sets the straw length
  frame_thickness: 3 # Frame thickness in cm, the same on all 4 sides
  delta_z_mid: 1.5 # Distance (z) by which the middle square of each layer sits upstream of the upper and lower squares in cm (> square depth)
